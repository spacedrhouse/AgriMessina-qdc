name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione (es. 1.0.0). Per release ufficiali usare invece un git tag vX.Y.Z.'
        required: false
        default: '0.0.0-dev'

# Permessi minimi per il GITHUB_TOKEN: senza `contents: write` softprops/action-gh-release
# fallisce con 403 "Resource not accessible by integration" quando prova a creare la
# release. Tutto il resto resta read (default repository settings).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Determina versione
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # github.ref_name = "v1.2.3" → strip della "v" → "1.2.3"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            [[ -z "$VERSION" ]] && VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versione build: $VERSION"

      - name: Install dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pandas openpyxl reportlab

      - name: Iniezione versione in _version.py
        # Riscrive _version.py con la versione corrente del build, così
        # l'app bundlata sa quale versione è e può confrontarla con la
        # latest su GitHub Releases (update_checker.py).
        shell: bash
        run: |
          echo "__version__ = \"${{ steps.version.outputs.version }}\"" > _version.py
          echo "Contenuto _version.py:"
          cat _version.py

      - name: Build con PyInstaller (--onedir)
        run: pyinstaller AgriMessina.spec --noconfirm --clean

      - name: Smoke test del bundle
        # Verifica che l'.exe sia stato creato. Non lo lanciamo (GUI senza display
        # nel runner CI), ma controllarne l'esistenza basta per fail-fast.
        shell: bash
        run: |
          test -f "dist/AgriMessina/AgriMessina.exe" || { echo "AgriMessina.exe non creato"; exit 1; }
          ls -la dist/AgriMessina/AgriMessina.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\AgriMessina.iss

      - name: Carica installer come artifact CI
        # Skip se è una release (il file viene già allegato alla GitHub Release sotto)
        # — evita doppia copia che mangia lo storage gratuito (~500MB).
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: AgriMessina-installer-${{ steps.version.outputs.version }}
          path: installer/output/*.exe
          if-no-files-found: error
          # 7 giorni invece di 30: per test rapidi basta, riduce di 4x lo storage usato
          retention-days: 7

      - name: Pubblica come Release GitHub (solo su push di tag)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
          # `generate_release_notes` rimosso: senza, softprops/action-gh-release
          # legge direttamente l'annotation message del tag (il -m di
          # `git tag -a`) e lo usa come body della release. Con quel flag attivo
          # le release notes erano sostituite dal preset GitHub auto-generato
          # (lista PR/commit), perdendo il commento manuale del tag.
          name: AgriMessina QDC ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
